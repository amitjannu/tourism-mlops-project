name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Verify Python
      run: |
        python --version

    - name: Show Files
      run: |
        ls -R
